name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build, publish, and release
    runs-on: ubuntu-latest
    environment: cd
    permissions:
      id-token: write    # required for OIDC trusted publisher (PyPI)
      contents: write    # required to create GitHub Release

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        # Only the wheel and sdist: `uv build` also writes a .gitignore into dist/, which
        # used to be attached as "default.gitignore".
        files: |
          dist/*.whl
          dist/*.tar.gz

  windows-installer:
    name: Windows installer
    needs: publish
    # Only a tag push has a release to attach to (workflow_dispatch may run on a branch).
    if: startsWith(github.ref, 'refs/tags/')
    # A called workflow may not ask for more than this grants, or the whole run fails to
    # start: windows-installer.yml's build job reads actions (SignPath fetches the unsigned
    # installer artifact) and its attach job writes the release.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/windows-installer.yml
    with:
      tag: ${{ github.ref_name }}
