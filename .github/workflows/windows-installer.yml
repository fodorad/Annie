name: Windows installer

# Builds Annie-Setup.exe and proves it works end to end on a real Windows machine:
# silent install to custom folders (setup downloads this commit's wheel into an env on
# the bundled Python, with no directory junction) -> the shortcut's launcher starts
# Annie with its tray -> the UI answers -> the bundled FFmpeg decodes video through
# torchcodec -> a second start reuses the running Annie -> uninstall removes everything
# except the user's work.
#
# CD calls this with a release tag to attach the installer to that GitHub Release, which
# keeps the permanent link .../releases/latest/download/Annie-Setup.exe current.

on:
  pull_request:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
      - "annie/app.py"
      - "annie/core/runtime.py"
      - "annie/desktop.py"
      - "annie/media/decode.py"
      - "data/**"
      - "pyproject.toml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach Annie-Setup.exe to.
        type: string
        required: true

jobs:
  installer:
    name: build and test installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read  # third-party actions run here, so no write access
      actions: read   # lets SignPath fetch the unsigned installer artifact
    defaults:
      run:
        shell: pwsh
    env:
      APP_ID_KEY: HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{E674FD3A-8545-44F6-875F-ED877FE764E3}_is1

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # hatch-vcs version + git describe

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Build wheel (the package the smoke test installs)
      run: uv build --wheel

    - name: Fetch bundled binaries (uv, Python, FFmpeg)
      run: installer/windows/fetch-deps.ps1 -OutDir installer/windows/build

    - name: Compile installer
      run: |
        $version = (git describe --tags --abbrev=0 2>$null) -replace '^v', ''
        if (-not $version) { $version = '0.0.0' }
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" installer\windows\annie.iss
        if ($LASTEXITCODE) { throw "ISCC failed with $LASTEXITCODE" }
        Get-Item installer\windows\Output\Annie-Setup.exe | Format-List Name, Length

    # Code signing through SignPath Foundation (free for open source), so Windows trusts
    # the installer's publisher. Off until the repository variable SIGNPATH_ORGANIZATION_ID
    # and the secret SIGNPATH_API_TOKEN exist (see docs/code-signing-policy.md), and never
    # for pull requests. The signed installer replaces the unsigned one, so the tests
    # below and the release both use what users download.
    - name: Upload unsigned installer for signing
      id: unsigned
      if: vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: Annie-Setup-unsigned
        path: installer/windows/Output/Annie-Setup.exe

    - name: Sign installer (SignPath)
      if: steps.unsigned.outcome == 'success'
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: Annie
        signing-policy-slug: release-signing
        github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: installer/windows/Output

    - name: Install silently (downloads this commit's wheel into the env)
      timeout-minutes: 20
      run: |
        $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
        # Inherited by the installer's launcher.pyw --install, so CI tests this commit.
        $env:ANNIE_PACKAGE = "annie[media,desktop] @ $(([System.Uri]$wheel).AbsoluteUri)"
        # The one install folder holds App (the program) and Data (the work).
        $root = "$env:RUNNER_TEMP\Annie test"   # a space in the path, on purpose
        $app = "$root\App"
        $data = "$root\Data"
        # Setup must add nothing to the registry (locked-down PCs): remember what is there.
        $regBefore = @(Get-ChildItem HKCU:\Software, 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object Name)
        Start-Process installer\windows\Output\Annie-Setup.exe -Wait `
          -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$root`""
        Get-Content "$app\install.log" -Tail 20 -ErrorAction SilentlyContinue
        foreach ($f in 'uv.exe', 'launcher.pyw', 'annie.ico', 'annie.png', 'annie.ini', 'unins000.exe',
                       'python\pythonw.exe', 'env\Scripts\pythonw.exe',
                       'ffmpeg\bin\ffmpeg.exe', 'ffmpeg\bin\ffprobe.exe', 'ffmpeg\LICENSE.txt') {
          if (-not (Test-Path "$app\$f")) { throw "missing $app\$f" }
        }
        foreach ($old in 'Annie.cmd', 'tools', 'bin') {
          if (Test-Path "$app\$old") { throw "first-installer leftover $old" }
        }
        $ini = Get-Content "$app\annie.ini" -Raw
        if ($ini -notmatch [regex]::Escape("data=$data")) { throw "annie.ini lacks the data folder:`n$ini" }
        # The env is built on the bundled Python's real folder: no directory junction for
        # Windows to refuse ("untrusted mount point", os error 448).
        $links = Get-ChildItem -Recurse -Force -Attributes ReparsePoint $app -ErrorAction SilentlyContinue
        if ($links) { $links | Select-Object FullName, LinkType, Target; throw 'junction/symlink in the install folder' }
        $cfg = Get-Content "$app\env\pyvenv.cfg" -Raw
        if ($cfg -notmatch [regex]::Escape("home = $app\python")) { throw "env is not on the bundled Python:`n$cfg" }
        # Annie starts from the "Annie" shortcut in the install folder; "Uninstall Annie"
        # (App\unins000.exe) sits next to it. No Start menu, and the desktop shortcut is
        # unticked by default.
        $shell = New-Object -ComObject WScript.Shell
        $starter = $shell.CreateShortcut("$root\Annie.lnk")
        if (-not (Test-Path "$root\Annie.lnk")) { throw "missing starter $root\Annie.lnk" }
        if ($starter.TargetPath -ne "$app\python\pythonw.exe" -or $starter.Arguments -ne "`"$app\launcher.pyw`"") {
          throw "starter runs '$($starter.TargetPath) $($starter.Arguments)'"
        }
        if ($shell.CreateShortcut("$root\Uninstall Annie.lnk").TargetPath -ne "$app\unins000.exe") {
          throw "missing or wrong $root\Uninstall Annie.lnk"
        }
        $startMenu = [Environment]::GetFolderPath('Programs')
        $desktop = [Environment]::GetFolderPath('Desktop')
        if (Test-Path "$startMenu\Annie.lnk") { throw 'Start menu shortcut created' }
        if (Test-Path "$desktop\Annie.lnk") { throw 'desktop shortcut created although unticked' }
        if (Test-Path $env:APP_ID_KEY) { throw 'Settings > Apps registry entry created' }
        $regAfter = @(Get-ChildItem HKCU:\Software, 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object Name)
        $added = @($regAfter | Where-Object { $regBefore -notcontains $_ })
        if ($added) { throw "setup added registry keys: $($added -join ', ')" }
        # The example datasets are ticked by default and go to the data folder.
        foreach ($f in 'config\mosei_mini.json', 'config\fi_mini.json', 'example\mosei_mini\label.csv') {
          if (-not (Test-Path "$data\examples\$f")) { throw "missing example $data\examples\$f" }
        }
        "APP=$app" >> $env:GITHUB_ENV
        "DATA=$data" >> $env:GITHUB_ENV
        "ROOT=$root" >> $env:GITHUB_ENV

    - name: The Annie starter starts Annie with its tray
      timeout-minutes: 5
      run: |
        $env:ANNIE_OPEN_BROWSER = '0'
        # What the starter runs, with python.exe instead of pythonw.exe so errors show here.
        & "$env:APP\python\python.exe" "$env:APP\launcher.pyw"
        if ($LASTEXITCODE) { Get-Content "$env:APP\install.log" -Tail 30; throw "launcher exited with $LASTEXITCODE" }
        $deadline = (Get-Date).AddMinutes(3)
        $page = ''
        while ($page -notmatch '<title>Annie</title>' -and (Get-Date) -lt $deadline) {
          Start-Sleep 5
          try { $page = (Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing -TimeoutSec 5).Content }
          catch { $page = '' }
        }
        if ($page -notmatch '<title>Annie</title>') {
          Get-ChildItem "$env:DATA\logs" -ErrorAction SilentlyContinue | Get-Content -Tail 40
          throw 'Annie did not come up'
        }
        $tray = Get-CimInstance Win32_Process -Filter "Name = 'pythonw.exe'" |
          Where-Object { $_.CommandLine -match 'annie\.desktop' }
        if (-not $tray) { throw 'annie.desktop is not running' }
        if (-not (Test-Path "$env:DATA\logs")) { throw 'Annie did not use the chosen data folder' }

    - name: Bundled FFmpeg and Visual C++ runtime decode video through torchcodec
      run: |
        # Only ANNIE_FFMPEG_LIB_DIR points at FFmpeg (not PATH), proving the DLL registration.
        $env:ANNIE_FFMPEG_LIB_DIR = "$env:APP\ffmpeg\bin"
        # PyTorch needs the Visual C++ runtime, which many PCs lack. This runner has it
        # system-wide, which hid that once, so check that the copy next to the bundled
        # python.exe is the one loaded: Windows searches the program's folder first.
        & "$env:APP\env\Scripts\python.exe" "installer\windows\check-decode.py" `
          "$env:APP\python" data\example\fi_mini\video\_ztmNiy8D3c.000.mp4
        if ($LASTEXITCODE) { throw 'decode failed' }

    - name: A second start reuses the running Annie
      timeout-minutes: 3
      run: |
        $env:ANNIE_OPEN_BROWSER = '0'
        & "$env:APP\python\python.exe" "$env:APP\launcher.pyw"
        if ($LASTEXITCODE) { throw "second start exited with $LASTEXITCODE" }
        # The env's pythonw.exe is a small stub that runs the bundled Python as its child,
        # so count the stubs: one per running Annie.
        $trays = @(Get-CimInstance Win32_Process -Filter "Name = 'pythonw.exe'" |
          Where-Object { $_.ExecutablePath -eq "$env:APP\env\Scripts\pythonw.exe" })
        if ($trays.Count -ne 1) { throw "expected one Annie, found $($trays.Count)" }

    - name: Uninstall removes everything except the user's work
      run: |
        # Judge only the uninstall: taken now, not at the start of the job, because the
        # browser a second start opens (Firefox on the runner) writes keys of its own.
        $regBefore = @(Get-ChildItem HKCU:\Software, 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object Name)
        Start-Process "$env:APP\unins000.exe" -Wait `
          -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
        # The uninstaller re-launches itself from %TEMP%, so wait for it to finish.
        $deadline = (Get-Date).AddMinutes(2)
        while ((Test-Path $env:APP) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
        if (Test-Path $env:APP) { Get-ChildItem -Recurse $env:APP | Select-Object -First 20; throw 'install folder left behind' }
        foreach ($lnk in "$env:ROOT\Annie.lnk", "$env:ROOT\Uninstall Annie.lnk") {
          if (Test-Path $lnk) { throw "shortcut left behind: $lnk" }
        }
        if (Test-Path $env:APP_ID_KEY) { throw 'registry key left behind' }
        $regAfter = @(Get-ChildItem HKCU:\Software, 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object Name)
        $added = @($regAfter | Where-Object { $regBefore -notcontains $_ })
        if ($added) { throw "registry keys left behind: $($added -join ', ')" }
        if (Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'annie\.desktop' }) { throw 'Annie still running' }
        if (-not (Test-Path $env:DATA)) { throw "silent uninstall must keep the user's work" }

    # The tray's "Download example datasets" fetches this from the latest release.
    - name: Package the example datasets
      run: |
        & installer\windows\build\python\python.exe -I -c `
          "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'data')" `
          installer/windows/Output/annie-examples
        if ($LASTEXITCODE) { throw 'zipping the examples failed' }
        Get-Item installer\windows\Output\annie-examples.zip | Format-List Name, Length

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: Annie-Setup
        path: |
          installer/windows/Output/Annie-Setup.exe
          installer/windows/Output/annie-examples.zip


  attach:
    # Separate from the build so the only job holding contents: write runs no third-party
    # actions: it just downloads the tested installer and uploads it to the release.
    name: attach installer and examples to release
    needs: installer
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: Annie-Setup
    - name: Upload to the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
      run: gh release upload "$TAG" Annie-Setup.exe annie-examples.zip --clobber
