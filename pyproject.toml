[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "annie"
dynamic = ["version"]
description = "Local-first browser UI to explore, inspect, and validate a video annotation dataset."
keywords = ["annotation", "dataset", "video", "visualization", "tracking", "mosei", "nicegui"]
authors = [
  { name = "fodorad", email = "fodorad201@gmail.com" },
]
readme = { "file" = "README.md", "content-type" = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Web Environment",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "nicegui>=3.16",
  "pillow>=10.0",
  "numpy",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# ── Media backend ────────────────────────────────────────────────────────────
# torch and torchcodec are pinned together and upgraded as a pair. Since 0.15,
# torchcodec builds against PyTorch's stable ABI, so one release supports a range
# of torch versions instead of exactly one.
#
# Compatibility (https://github.com/meta-pytorch/torchcodec#readme):
#   torchcodec 0.15 - 0.17 -> torch >= 2.11
#
# torchcodec also requires FFmpeg (major versions 4-9); the same install backs the
# render pipeline. The Windows installer bundles its own build, pinned in
# installer/windows/fetch-deps.ps1. To upgrade: bump both pins together and verify
# CI passes, including the Windows jobs. Without this extra, the pure layers
# (scanning, parsing, matching, storage, theme, colour) still install and run; only
# frame decode/render need it.
media = [
  "torch==2.14.1",
  "torchcodec==0.17.0",
]
# ── Windows desktop app ──────────────────────────────────────────────────────
# The notification-area (tray) icon of `python -m annie.desktop`, which the Windows
# installer starts. Elsewhere it installs nothing and Annie runs without the icon.
desktop = [
  "pystray>=0.19; sys_platform == 'win32'",
]
dev = [
  "ruff",
  "ty",
  "coverage",
  "pre-commit",
  # The end-to-end tests drive a real browser (tests/e2e); `make dev` fetches Chromium.
  "playwright",
]
docs = [
  "sphinx>=8.0",
  "furo",
  "sphinx-autoapi",
  "sphinx-autobuild",
  "myst-parser",
  # Playbook screenshots (make screenshots): Playwright drives a real browser against a
  # running Annie, Pillow downsizes the 2x captures. Needs a one-off browser download,
  # `playwright install chromium`, which is why `make screenshots` does it for you.
  "playwright",
  "pillow",
]
all = [
  "annie[media,desktop]",
]

[project.scripts]
annie = "annie.app:main"

[project.urls]
Documentation = "https://fodorad.github.io/Annie/"
Issues = "https://github.com/fodorad/Annie/issues"
Source = "https://github.com/fodorad/Annie"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["annie"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TCH", "ARG", "PIE", "D"]
ignore = [
  "D107",  # Missing docstring in __init__ (covered by class docstring)
  "D203",  # Blank line before class (conflicts with D211)
  "D213",  # Multi-line summary second line (conflicts with D212)
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**/test_*.py" = ["D", "S", "ARG"]
"docs/conf.py" = ["D", "ARG"]

[tool.coverage.run]
source = ["annie"]
# The end-to-end tests run Annie as its own process (python -m annie.app); measure it too.
# Each process writes its own data file, so `coverage combine` runs before the report.
patch = ["subprocess"]
omit = [
  "*/tests/*",
  "*/__init__.py",
  # The Windows tray wrapper: pystray + a real desktop session; it only starts and
  # stops annie.app (which is measured).
  "annie/desktop.py",
]

[tool.coverage.report]
fail_under = 90  # the floor measured in CI (fewer media tools than a dev machine); only ever raise it
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "coverage_html"

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
